<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="{{r}}assets/favicon.png" rel="icon">
    <link rel="stylesheet" href="{{r}}styles.css">
    <link rel="preload" href="{{r}}assets/fonts/gabarito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        .store-section { min-height: calc(100vh - 200px); }
        .store-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 3rem 20px;
            text-align: center;
        }
        .store-container .form-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            padding-bottom: 20px;
            box-sizing: border-box;
        }
        .store-container .form-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

{{header}}

    <section class="section store-section" style="background-color: var(--color-white-gray);">
        <div class="store-container">
            <h1 style="font-size: 2.5rem; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--color-dark-gray);">{{hero.title}}</h1>
            <p style="font-size: 1.2rem; margin-bottom: 2rem; color: var(--color-dark-gray);">{{hero.p}}</p>

            <div class="form-container">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfsKgde-qB6MearYGfaIB0xcavMeEQ13iq89cDbOM8Ln_RgTA/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading...</iframe>
            </div>
        </div>
    </section>

{{footer}}

</body>
</html>
