<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta
        content="{{description}}"
        name="description">
    <meta
        content="{{keywords}}"
        name="keywords">

    <meta property="og:image" content="https://boquila.org/assets/lab.webp"/>
    <meta property="twitter:image" content="https://boquila.org/assets/lab.webp"/>
    <meta name="twitter:image:src" content="https://boquila.org/assets/lab.webp">

    <link href="{{r}}assets/favicon.png" rel="icon">
        
    <link rel="stylesheet" href="{{r}}styles.css">
    <link rel="preload" href="{{r}}assets/fonts/gabarito-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

{{header}}

    <section class="hero">
        <div class="container">
            <div class="hero-box">
                <h1 class="product-logo"><img src="{{r}}assets/logos/boquilab.svg" alt="{{brand}}" width="126" height="32"></h1>
                <p>{{hero.p}}</p>
                <button class="btn-link" style="margin-top: 2rem; cursor: not-allowed; opacity: 0.7;">{{comingSoon}}</button>
            </div>
        </div>
    </section>

    <section class="section product-overview" aria-labelledby="overview-title">
        <div class="container">
            <div class="product-overview-grid">
                <div class="product-overview-copy">
                    <h2 class="product-overview-title" id="overview-title">{{overview.title}}</h2>
                    <ul class="feature-list">
                        <li>
                            <svg aria-hidden="true"><use href="{{r}}assets/icons.svg#icon-eye"></use></svg>
                            <span>{{feat1}}</span>
                        </li>
                        <li>
                            <svg aria-hidden="true"><use href="{{r}}assets/icons.svg#icon-heart"></use></svg>
                            <span>{{feat2}}</span>
                        </li>
                        <li>
                            <svg aria-hidden="true"><use href="{{r}}assets/icons.svg#icon-bolt"></use></svg>
                            <span>{{feat3}}</span>
                        </li>
                    </ul>
                </div>
                <div class="product-preview">
                    <img src="{{r}}assets/lab.webp" alt="{{img.alt}}" width="706" height="576" loading="lazy" decoding="async">
                </div>
            </div>
        </div>
    </section>

{{footer}}

</body>
</html>
