<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="{{r}}assets/favicon.png" rel="icon">
    <link rel="stylesheet" href="{{r}}styles.css">
    <link rel="preload" href="{{r}}assets/fonts/gabarito-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

{{header}}

    <section class="hero">
        <div class="container">
            <div class="hero-box">
                <h1>Boquila<span>Merch</span></h1>
                <p>{{hero.p}}</p>
            </div>
        </div>
    </section>

    <section class="section" style="background-color: var(--color-white-gray);">
        <div class="container">
            <p style="text-align: center; font-size: 1.2rem; margin-top: 0; margin-bottom: 2rem;">{{form.p}}</p>
            <div style="width: 100%; height: 100vh;">
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfsKgde-qB6MearYGfaIB0xcavMeEQ13iq89cDbOM8Ln_RgTA/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0" style="border:none; width:100%; height:100%;">Loading...</iframe>
            </div>
        </div>
    </section>

{{footer}}

</body>
</html>
